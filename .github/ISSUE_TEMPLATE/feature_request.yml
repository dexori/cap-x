name: Feature request
description: Propose a focused improvement or benchmark extension
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem would this solve, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior, interface, and likely implementation scope.
    validations:
      required: true
  - type: textarea
    id: benchmark
    attributes:
      label: Benchmark impact
      description: Would this change prompts, tasks, APIs, success criteria, seeds, or comparability with prior results?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement or test this change.
