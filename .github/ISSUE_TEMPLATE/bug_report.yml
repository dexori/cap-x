name: Bug report
description: Report a reproducible problem in CaP-X
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include API keys or private data. Report security issues through the private
        process in SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact command and the smallest config or code sample that reproduces it.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: simulator
    attributes:
      label: Simulator or environment
      options:
        - Robosuite
        - LIBERO-PRO
        - BEHAVIOR / OmniGibson
        - Real robot
        - Web UI
        - Core / simulator-independent
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Git commit, dirty state, OS, Python, GPU, CUDA/driver, simulator, and model/provider versions.
      placeholder: |
        CaP-X commit:
        Worktree clean: yes/no
        OS and Python:
        GPU, driver, CUDA:
        Simulator and dataset:
        Model and provider:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the shortest useful traceback or log excerpt after removing secrets.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
